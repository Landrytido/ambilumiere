plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvlights'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvlights'
        minSdk 26
        // The TV is Android 11. Targeting 30 keeps the foreground service free of the Android 14 service-type rules.
        targetSdk 30
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with the debug key, like the launcher.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Sideloaded on an Android 11 TV, never on Google Play: the store's minimum target level doesn't apply.
        disable 'ExpiredTargetSdkVersion'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // No libraries in the APK. Test only: plain JVM tests in src/test; org.json because android.jar's copy is a stub there.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
